# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "MZML_PROCESSING"
description: Process mzML files including optional chunking for parallel processing
keywords:
  - mzml
  - mass spectrometry
  - chunk
  - split
  - ms2
components:
  - splitmzmlintochunks
input:
  - ch_mzml:
      type: file
      description: |
        Channel containing meta map and mzML file
        Structure: tuple val(meta), path(mzml)
        pattern: "*.mzML"
  - chunksize:
      type: integer
      description: |
        Number of MS2 spectra per chunk (optional)
        If not provided or 0, files will not be split
output:
  - mzml:
      type: file
      description: |
        Processed mzML files (chunked or original)
        Structure: tuple val(meta), path(mzml)
        pattern: "*.mzML"
  - versions:
      type: file
      description: |
        File containing software versions
        pattern: "versions.yml"
authors:
  - "@yourusername"
maintainers:
  - "@yourusername"
