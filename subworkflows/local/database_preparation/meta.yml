# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "DATABASE_PREPARATION"
description: Prepare protein database for peptide identification by generating entrapment and decoy sequences
keywords:
  - database
  - fasta
  - decoy
  - entrapment
  - mass spectrometry
components:
  - callentrapmentdatabase
  - openms/decoydatabase
input:
  - ch_fasta:
      type: file
      description: |
        Channel containing meta map and protein FASTA file
        Structure: tuple val(meta), path(fasta)
        pattern: "*.{fasta,fa}"
  - fold:
      type: integer
      description: |
        Fold parameter for entrapment database generation (optional)
        Set to null or 0 to skip entrapment database generation
output:
  - fasta_with_decoys:
      type: file
      description: |
        FASTA file with target, entrapment, and decoy sequences
        pattern: "*.fasta"
  - versions:
      type: file
      description: |
        File containing software versions
        pattern: "versions.yml"
authors:
  - "@yourusername"
maintainers:
  - "@yourusername"
